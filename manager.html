<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAKU • მენეჯერი</title>
<meta name="theme-color" content="#101828"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#192439;font:15px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{background:#101828;color:white;padding:18px max(20px,calc((100vw - 1150px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}header b{font-size:22px}header small{color:#b8f36b}.wrap{max-width:1150px;margin:auto;padding:25px 16px 70px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.panel{background:#fff;border:1px solid #e3e9f2;border-radius:17px;padding:20px;box-shadow:0 5px 18px #1b2b4210}.card strong{display:block;font-size:30px;margin-top:10px}.muted{color:#6e7c90}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.toolbar input,.toolbar select,.field{border:1px solid #dbe3ef;border-radius:11px;padding:12px;background:white;min-width:0}.toolbar input{flex:1;min-width:210px}.btn{background:#17283d;color:white;border:0;border-radius:10px;padding:11px 15px}.btn:disabled{opacity:.5}.panel{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:13px;text-align:left;border-bottom:1px solid #edf0f5;vertical-align:middle}th{font-size:12px;color:#75839a}td{font-size:13px}.status{border:1px solid #dce4ee;border-radius:9px;padding:9px;background:#fff;max-width:180px}.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top left,#dcefd6,transparent 55%),#f4f7fb}.login .panel{width:min(430px,100%);padding:30px}.login input{display:block;width:100%;margin:12px 0}.login button{width:100%;margin-top:8px}.error{color:#b42318;min-height:22px;font-size:13px}.pill{background:#eaf5e8;color:#327444;border-radius:30px;padding:5px 10px;font-size:12px}.details{white-space:normal;max-width:270px}.empty{text-align:center;padding:35px;color:#75839a}#notice{margin:12px 0;color:#b42318}footer{color:#8792a2;text-align:center;padding:30px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}header{padding:15px}.wrap{padding:18px 12px}h1{font-size:23px}.card{padding:15px}.card strong{font-size:24px}}</style></head><body>
<div id="login" class="login"><form id="loginForm" class="panel"><div style="font-weight:900;font-size:25px">MAKU <span style="color:#47996d">MANAGER</span></div><h2>მენეჯერის შესვლა</h2><p class="muted">წვდომა მხოლოდ უფლებამოსილი თანამშრომლებისთვის</p><input id="email" class="field" type="email" placeholder="ელფოსტა" required autocomplete="username"><input id="password" class="field" type="password" placeholder="პაროლი" required autocomplete="current-password"><p id="loginError" class="error"></p><button class="btn">შესვლა</button></form></div>
<div id="app" class="hidden"><header><div><b>MAKU</b> <small>MANAGER</small></div><button id="logout" class="btn" style="background:#293c55">გასვლა</button></header><main class="wrap"><h1>შეკვეთების მართვა</h1><p class="muted">შეკვეთების დამუშავება და სტატუსების განახლება</p><div class="grid"><div class="card">სულ შეკვეთები<strong id="all">—</strong></div><div class="card">ახალი<strong id="new">—</strong></div><div class="card">მუშავდება<strong id="active">—</strong></div></div><div class="toolbar"><input id="search" placeholder="მოძებნე ნომრით, სახელით ან ტელეფონით"><select id="filter"><option value="">ყველა სტატუსი</option><option>ახალი</option><option>მუშავდება</option><option>დასრულებული</option><option>გაუქმებული</option></select><button id="refresh" class="btn">განახლება</button></div><div id="notice" role="alert"></div><section class="panel"><table><thead><tr><th>შეკვეთა</th><th>მომხმარებელი</th><th>პროდუქცია</th><th>ჯამი</th><th>სტატუსი</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">იტვირთება...</td></tr></tbody></table></section></main><footer>MAKU • ოპერაციული სამუშაო სივრცე</footer></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(()=>{'use strict';
const cfg={apiKey:"AIzaSyDuZpWaZFY18eyJNOMjFap2XVTr6D0cMyE",authDomain:"makasia.firebaseapp.com",projectId:"makasia",storageBucket:"makasia.firebasestorage.app",messagingSenderId:"51102698357",appId:"1:51102698357:web:59f62a3c8e76663947a13c"};
firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);let orders=[],authorized=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('ka-GE',{style:'currency',currency:'GEL'}).format(Number(n)||0);
function total(o){for(const k of ['totalAmount','total','amount','grandTotal','totalPrice','subtotal']){let v=Number(String(o[k]??'').replace(/[^0-9.,-]/g,'').replace(',','.'));if(v>0)return v}return 0}
function items(o){let a=o.items||o.productDetails||[];if(typeof a==='string'){try{a=JSON.parse(a)}catch{a=[]}}return Array.isArray(a)?a:[]}
function draw(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=orders.filter(o=>(!f||o.status===f)&&(!q||[o.orderNumber,o.customerName,o.phone,o.customerPhone,o.id].some(v=>String(v??'').toLowerCase().includes(q))));
$('all').textContent=orders.length;$('new').textContent=orders.filter(o=>o.status==='ახალი').length;$('active').textContent=orders.filter(o=>o.status==='მუშავდება').length;
$('rows').innerHTML=list.length?list.map(o=>'<tr><td><b>'+esc(o.orderNumber||o.id)+'</b><div class="muted">'+esc(o.createdAt?.toDate?.()?.toLocaleDateString('ka-GE')||'')+'</div></td><td>'+esc(o.customerName||o.userEmail||'—')+'<div class="muted">'+esc(o.phone||o.customerPhone||'')+'</div></td><td class="details">'+(items(o).map(i=>esc(i.name||i.productName||i.title||'პროდუქტი')+' × '+esc(i.quantity||i.qty||1)).join('<hr style="border:0;border-top:1px solid #eee">')||'—')+'</td><td>'+money(total(o))+'</td><td><select class="status" data-id="'+esc(o.id)+'">'+['ახალი','მუშავდება','დასრულებული','გაუქმებული'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join(''):'<tr><td colspan="5" class="empty">შეკვეთები ვერ მოიძებნა</td></tr>';
document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('change',async()=>{const o=orders.find(x=>x.id===el.dataset.id);if(!o)return;el.disabled=true;$('notice').textContent='';try{await db.collection('orders').doc(o.id).update({status:el.value,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});o.status=el.value;draw()}catch(e){$('notice').textContent='სტატუსი ვერ შეიცვალა: '+(e.code||e.message);draw()}}))}
async function load(){if(!authorized)return;$('notice').textContent='';try{const s=await db.collection('orders').limit(200).get();orders=s.docs.map(d=>({id:d.id,...d.data()}));orders.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));draw()}catch(e){$('notice').textContent='შეკვეთების წაკითხვა ვერ მოხერხდა: '+(e.code||e.message);$('rows').innerHTML='<tr><td colspan="5" class="empty">მონაცემები მიუწვდომელია</td></tr>'}}
auth.onAuthStateChanged(async u=>{authorized=false;$('app').classList.add('hidden');$('login').classList.remove('hidden');if(!u)return;try{const d=await db.collection('users').doc(u.uid).get();const role=d.data()?.role;if(role!=='manager'&&role!=='admin'){await auth.signOut();$('loginError').textContent='ამ ანგარიშს მენეჯერის უფლება არ აქვს.';return}authorized=true;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('loginError').textContent='უფლების შემოწმება ვერ მოხერხდა: '+(e.code||e.message)}});
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value)}catch(e){$('loginError').textContent='შესვლა ვერ მოხერხდა: '+(e.code||e.message)}};
$('logout').onclick=()=>auth.signOut();$('search').oninput=draw;$('filter').onchange=draw;$('refresh').onclick=load;
})();
</script></body></html>
