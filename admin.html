document.body.appendChild(modal);const close=()=>modal.remove();$("#closeEditor").onclick=close;$("#cancelEditor").onclick=close;modal.addEventListener("click",e=>{if(e.target===modal)close()});$("#editForm").onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;const obj={};for(const f of fields){let v=e.currentTarget.elements[f.k]?.value;if(v!==undefined){if(f.t==="number")obj[f.k]=v===""?null:Number(v);else obj[f.k]=v.trim()}}obj.updatedAt=firebase.firestore.FieldValue.serverTimestamp();try{let ref;if(item)ref=db.collection(collection).doc(item.id);else ref=db.collection(collection).doc();if(type==="promos"){obj.code=String(obj.code||"").toUpperCase();obj.status=obj.status||"აქტიური"}if(type==="products")obj.stock=Number(obj.stock||0);await ref.set(obj,{merge:true});await logAction(item?"update":"create",collection,ref.id,JSON.stringify(Object.keys(obj)));close();toast("შენახულია");await load()}catch(err){console.error(err);$("#editError").textContent="შენახვა ვერ მოხერხდა: "+(err.code||err.message);btn.disabled=false}}}
