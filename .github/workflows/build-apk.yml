name: Build Makasia Admin APK

on:
  push:
    paths:
      - 'mobile-admin.html'
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare HTML asset
        run: mkdir -p app/src/main/assets && cp mobile-admin.html app/src/main/assets/mobile-admin.html
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makasia-Admin
          path: app/build/outputs/apk/debug/app-debug.apk
