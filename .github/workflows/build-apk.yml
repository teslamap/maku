name: Build Makasia Apps

on:
  push:
    paths:
      - 'mobile-admin.html'
      - 'mobile-index.html'
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare assets
        run: |
          mkdir -p app/src/main/assets
          cp mobile-admin.html app/src/main/assets/mobile-admin.html
          cp mobile-index.html app/src/main/assets/mobile-index.html
      - name: Prepare labels
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/app_labels.xml <<'EOF'
          <resources>
              <string name="appLabel">Makasia</string>
          </resources>
          EOF
          mkdir -p app/src/admin/res/values
          cat > app/src/admin/res/values/app_labels.xml <<'EOF'
          <resources>
              <string name="appLabel">Makasia Admin</string>
          </resources>
          EOF
          mkdir -p app/src/store/res/values
          cat > app/src/store/res/values/app_labels.xml <<'EOF'
          <resources>
              <string name="appLabel">Makasia</string>
          </resources>
          EOF
      - name: Build Admin APK
        run: gradle --no-daemon :app:assembleAdminDebug
      - name: Build Makasia APK
        run: gradle --no-daemon :app:assembleStoreDebug
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Makasia-Admin
          path: app/build/outputs/apk/admin/debug/app-admin-debug.apk
      - name: Upload Makasia APK
        uses: actions/upload-artifact@v4
        with:
          name: Makasia
          path: app/build/outputs/apk/store/debug/app-store-debug.apk
