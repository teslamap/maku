name: Build Makasia Admin V2 APK

on:
  push:
    branches:
      - rebuild/admin-v2-foundation
    paths:
      - 'admin-v2.html'
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare Admin V2 asset
        run: |
          mkdir -p app/src/main/assets
          cp admin-v2.html app/src/main/assets/admin-v2.html
      - name: Set Admin label
        run: |
          mkdir -p app/src/admin/res/values
          cat > app/src/admin/res/values/app_labels.xml <<'EOF'
          <resources><string name="appLabel">Makasia Admin</string></resources>
          EOF
      - name: Build Admin APK
        run: gradle --no-daemon :app:assembleAdminDebug
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Makasia-Admin-V2
          path: app/build/outputs/apk/admin/debug/app-admin-debug.apk
