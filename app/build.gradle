plugins {
    id 'com.android.application'
}

android {
    namespace 'com.makasia.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.makasia.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    flavorDimensions 'app'
    productFlavors {
        admin {
            dimension 'app'
            applicationId 'com.makasia.admin'
            versionName '1.0-admin'
        }
        manager {
            dimension 'app'
            applicationId 'com.makasia.manager'
            versionName '1.0-manager'
        }
        store {
            dimension 'app'
            applicationId 'com.makasia.store'
            versionName '1.0'
        }
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
