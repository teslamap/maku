<!DOCTYPE html>
<html lang="ka">
<head>

<style>
:root{--bg:#0c111b;--panel:#151c29;--panel2:#1c2636;--line:#2b374a;--muted:#93a1b6;--txt:#f2f5fb;--violet:#8b5cf6;--cyan:#42d5c3;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--txt);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto;background:var(--bg)}
.top{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#111724;gap:8px}.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px}.mark{height:31px;width:31px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,#b59aff,#7040db);font-weight:900}.sub{font-size:11px;color:var(--muted);font-weight:500;display:block;letter-spacing:0}.toptools{display:flex;gap:6px}.iconbtn,.action{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:10px;min-height:35px;padding:0 10px;font-weight:650}.iconbtn{min-width:36px;padding:0 8px;font-size:16px}.primary{background:var(--violet);border-color:var(--violet);color:white}.work{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}.canvas-head{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:var(--muted);font-size:11px}.canvas-actions{display:flex;gap:6px;align-items:center}.canvas-actions button{height:27px;padding:0 9px;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:7px}
.viewport{flex:1;min-height:120px;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:5px 12px 15px;background:radial-gradient(ellipse at center,#192235 0%,#0c111b 70%)}.artboard{width:min(100%,390px);min-height:100%;height:100%;max-height:100%;position:relative;flex:none;background:#fff;color:#202532;border-radius:15px;overflow:auto;box-shadow:0 12px 42px #0008;outline:1px solid #344055;transform-origin:top center}.artboard.empty:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#cbd5e1 1px,transparent 1px),linear-gradient(90deg,#cbd5e1 1px,transparent 1px);background-size:24px 24px;opacity:.12}.empty-message{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);text-align:center;color:#8994a5;pointer-events:none}.empty-icon{width:58px;height:58px;border:1px dashed #aab4c4;border-radius:18px;display:grid;place-items:center;font-size:27px;margin:0 auto 12px;color:#9aa5b6}.empty-message b{display:block;color:#657184;font-size:14px;margin-bottom:5px}.empty-message small{font-size:11px;line-height:1.6}.canvas-el{position:relative;max-width:100%;min-width:20px;cursor:move;touch-action:pan-y;user-select:none}.canvas-el.is-selected{outline:2px solid #8b5cf6!important;outline-offset:2px;z-index:5}.canvas-el.drag-over{outline:2px dashed #06b6d4!important}.floating{position:absolute;top:7px;right:7px;z-index:10;display:flex;gap:5px}.floating button{border:0;border-radius:8px;background:#151c29eF;color:white;padding:7px 10px}
.bottom{flex:none;background:#111724;border-top:1px solid var(--line);padding-bottom:var(--safe);max-height:47%;display:flex;flex-direction:column}.tabs{display:flex;align-items:stretch;justify-content:space-around;min-height:59px;border-bottom:1px solid var(--line);padding:3px 4px}.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:#8e9bb0;font-size:10px;font-weight:650;border-radius:9px}.tab .glyph{font-size:19px;line-height:20px}.tab.active{color:#d9ccff;background:#292341}.panel{overflow:auto;padding:10px 12px 12px;min-height:120px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;font-weight:750;font-size:12px}.panel-title span{font-size:10px;color:var(--muted);font-weight:500}.tools-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tool{min-height:63px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:#e8edf6;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;font-size:10px;font-weight:650}.tool:active,.tool:hover{background:#27233e;border-color:#7655d7}.tool i{font-style:normal;font-size:20px;color:#c5b3ff;line-height:22px}.row{display:flex;gap:8px;align-items:center}.field{flex:1;min-width:0}.field label{display:block;color:var(--muted);font-size:10px;margin:0 0 5px}.field input[type=text],.field input[type=number],.field select{width:100%;border:1px solid var(--line);background:#0d1420;color:var(--txt);border-radius:9px;padding:9px;font:inherit;font-size:12px}.field input[type=color]{width:100%;height:35px;border:1px solid var(--line);border-radius:9px;background:#0d1420;padding:3px}.field input[type=range]{width:100%;accent-color:var(--violet)}.property-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.property-actions{display:flex;gap:7px;margin-top:10px}.property-actions button{flex:1}.layers{display:flex;flex-direction:column;gap:5px}.layer{display:flex;align-items:center;gap:9px;padding:9px 10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;font-size:11px;color:#dce3ef}.layer.active{border-color:var(--violet);background:#292341}.layer .type{width:26px;height:26px;border-radius:7px;background:#2a3040;display:grid;place-items:center;color:#c5b3ff;font-size:14px}.layer .lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer button{background:transparent;border:0;color:#91a0b6;padding:4px}.empty-panel{color:var(--muted);font-size:11px;text-align:center;padding:18px 10px;line-height:1.6}.toast{position:fixed;bottom:calc(160px + var(--safe));left:50%;transform:translateX(-50%);background:#273348;color:white;padding:10px 14px;border:1px solid #46556e;border-radius:10px;font-size:11px;z-index:99;display:none}.toast.show{display:block}.overlay{display:none}
@media(min-width:700px){.app{max-width:1200px}.work{flex-direction:row}.canvas-head{position:absolute;top:0;left:0;right:0;z-index:2;background:#0c111be0;height:38px}.viewport{padding-top:47px}.artboard{height:720px;min-height:720px}.bottom{width:310px;max-height:none;border-top:0;border-left:1px solid var(--line)}.tabs{min-height:55px}.panel{flex:1}.toast{bottom:25px}.top{height:62px}}
@media(max-height:720px){.bottom{max-height:44%}.tabs{min-height:52px}.tool{min-height:54px}.panel{padding-top:7px}.viewport{padding-bottom:8px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="mark">M</div><div>MAKASIA <span class="sub">MOBILE CANVAS · BUILDER</span></div></div><div class="toptools"><button class="iconbtn" title="Undo" onclick="undo()">↶</button><button class="iconbtn" title="Redo" onclick="redo()">↷</button><button class="iconbtn" title="Preview" onclick="preview()">◉</button><button class="iconbtn primary" title="Save" onclick="save()">✓</button><button class="iconbtn" title="Export" onclick="exportHtml()">⇩</button></div></header>
<div class="work"><div class="canvas-head"><span>CANVAS <b id="canvasCount" style="color:#e7eaf1">· ცარიელი</b></span><div class="canvas-actions"><button onclick="setZoom(-.1)">−</button><span id="zoomText">100%</span><button onclick="setZoom(.1)">＋</button><button onclick="clearCanvas()">გასუფთავება</button></div></div>
<div class="viewport" id="viewport"><div class="artboard empty" id="artboard"><div class="empty-message" id="emptyMsg"><div class="empty-icon">＋</div><b>ცარიელი სამუშაო სივრცე</b><small>დაამატე ელემენტი ქვედა პანელიდან<br>ან გადაიტანე ის აქ.</small></div></div></div>
<aside class="bottom"><nav class="tabs"><button class="tab active" data-tab="add" onclick="tab('add')"><span class="glyph">▦</span>ელემენტები</button><button class="tab" data-tab="style" onclick="tab('style')"><span class="glyph">◐</span>სტილი</button><button class="tab" data-tab="layers" onclick="tab('layers')"><span class="glyph">☷</span>შრეები</button><button class="tab" data-tab="page" onclick="tab('page')"><span class="glyph">⚙</span>გვერდი</button></nav><div class="panel" id="panel"></div></aside></div>
</div><div class="toast" id="toast"></div>
<script>
const board=document.getElementById('artboard'),panel=document.getElementById('panel');let activeTab='add',selected=null,zoom=1,nextId=1,history=[],historyAt=-1,dragged=null;
const defs={"text":{"name":"ტექსტი","icon":"T","tag":"p","text":"შენი ტექსტი აქ","style":"font-size:16px;color:#303746;padding:8px;margin:8px;"},"heading":{"name":"სათაური","icon":"H","tag":"h2","text":"ახალი სათაური","style":"font-size:28px;font-weight:800;color:#202532;padding:8px;margin:8px;"},"button":{"name":"ღილაკი","icon":"▣","tag":"button","text":"დააჭირე აქ","style":"padding:12px 20px;background:#7650d8;color:white;border:0;border-radius:10px;font-size:14px;margin:8px;"},"image":{"name":"სურათი","icon":"▧","tag":"div","text":"＋ სურათის ადგილი","style":"height:130px;background:#edf0f6;border:1px dashed #a5afc0;border-radius:12px;display:grid;place-items:center;color:#7a8495;margin:8px;padding:12px;"},"container":{"name":"კონტეინერი","icon":"▢","tag":"div","text":"კონტეინერი","style":"min-height:100px;padding:18px;border:1px dashed #aab4c4;border-radius:12px;margin:8px;background:#f7f8fb;color:#586174;"},"divider":{"name":"გამყოფი","icon":"━","tag":"hr","text":"","style":"border:0;border-top:1px solid #d8dee8;margin:14px 8px;"},"spacer":{"name":"სივრცე","icon":"↕","tag":"div","text":"","style":"height:36px;margin:4px;"},"badge":{"name":"ნიშანი","icon":"✦","tag":"span","text":"ახალი","style":"display:inline-block;padding:5px 10px;border-radius:20px;background:#eee7ff;color:#6844b7;font-size:12px;margin:8px;"},"card":{"name":"ბარათი","icon":"▤","tag":"div","text":"ბარათის სათაური","style":"padding:18px;border-radius:14px;background:#f3f5f9;box-shadow:0 4px 16px #17203312;margin:8px;color:#263044;min-height:90px;"},"logo":{"name":"Makasia ლოგო","icon":"Ⓜ","tag":"div","text":"MAKASIA","style":"font-size:23px;font-weight:900;letter-spacing:1px;color:#bc477c;padding:12px;margin:5px;"},"nav":{"name":"მენიუს ბმული","icon":"☰","tag":"span","text":"პროდუქტები","style":"display:inline-block;padding:10px 12px;color:#353849;font-size:13px;font-weight:700;margin:3px;"},"iconbtn":{"name":"აიქონ ღილაკი","icon":"♡","tag":"button","text":"♡","style":"width:42px;height:42px;border:1px solid #e4e6ed;border-radius:13px;background:#fff;color:#333;font-size:22px;margin:5px;"},"search":{"name":"ძიების ველი","icon":"⌕","tag":"div","text":"⌕  მოძებნე პროდუქტი...","style":"padding:13px 15px;border:1px solid #e0e3eb;border-radius:13px;background:#f7f8fb;color:#9299a8;font-size:13px;margin:8px;"},"category":{"name":"კატეგორია","icon":"◉","tag":"span","text":"ყველა","style":"display:inline-block;padding:9px 15px;border-radius:20px;background:#262b3c;color:#fff;font-weight:700;font-size:12px;margin:4px;"},"productImage":{"name":"პროდუქტის ფოტო","icon":"▧","tag":"div","text":"პროდუქტის ფოტო","style":"height:160px;display:grid;place-items:center;background:#f3f4f8;border-radius:14px;color:#9ba3b1;font-size:12px;margin:6px;"},"productName":{"name":"პროდუქტის სახელი","icon":"Aa","tag":"h3","text":"პროდუქტის დასახელება","style":"font-size:15px;font-weight:750;color:#262b39;margin:8px;"},"price":{"name":"ფასი","icon":"₾","tag":"strong","text":"49.00 ₾","style":"display:inline-block;font-size:18px;font-weight:900;color:#b53d77;margin:7px;"},"oldPrice":{"name":"ძველი ფასი","icon":"₾̶","tag":"del","text":"69.00 ₾","style":"display:inline-block;font-size:12px;color:#9aa0ac;margin:5px;"},"favorite":{"name":"რჩეულებში დამატება","icon":"♥","tag":"button","text":"♡","style":"border:1px solid #e7e7ed;border-radius:50%;width:38px;height:38px;background:#fff;color:#d34b81;font-size:19px;margin:5px;"},"cartBtn":{"name":"კალათაში დამატება","icon":"🛒","tag":"button","text":"კალათაში დამატება","style":"padding:12px 15px;border:0;border-radius:12px;background:#c34b83;color:#fff;font-size:12px;font-weight:800;margin:7px;"},"quantity":{"name":"რაოდენობის კონტროლი","icon":"±","tag":"div","text":"−    1    ＋","style":"display:inline-block;padding:10px 13px;border:1px solid #e3e5ec;border-radius:10px;color:#303746;font-weight:800;margin:6px;"},"rating":{"name":"შეფასება","icon":"★","tag":"div","text":"★★★★★  4.9","style":"color:#e5a72d;font-size:13px;margin:7px;"},"sale":{"name":"ფასდაკლების ნიშანი","icon":"％","tag":"span","text":"−25%","style":"display:inline-block;padding:6px 9px;border-radius:8px;background:#ffe8ef;color:#bd386d;font-size:12px;font-weight:900;margin:5px;"},"input":{"name":"შეყვანის ველი","icon":"▭","tag":"div","text":"შეიყვანე ტექსტი...","style":"padding:13px;border:1px solid #e0e3eb;border-radius:10px;background:#fff;color:#969eac;font-size:12px;margin:7px;"},"promo":{"name":"პრომო კოდი","icon":"％","tag":"div","text":"PROMO CODE     გამოყენება","style":"padding:13px;border:1px dashed #c7a5ba;border-radius:11px;background:#fff7fb;color:#9d4774;font-size:12px;margin:8px;"},"banner":{"name":"აქციის ბანერი","icon":"▰","tag":"div","text":"სპეციალური შეთავაზება  ·  −30%","style":"padding:20px 14px;border-radius:15px;background:linear-gradient(120deg,#fbe0ec,#eee5ff);color:#843d70;font-size:17px;font-weight:900;margin:8px;"},"newsletter":{"name":"სიახლეების გამოწერა","icon":"✉","tag":"div","text":"სიახლეების გამოწერა   [ ელფოსტა ]","style":"padding:18px;border-radius:14px;background:#f6f0f5;color:#53394d;font-size:14px;font-weight:750;margin:8px;"},"footer":{"name":"ქვედა კოლონტიტული","icon":"▤","tag":"div","text":"MAKASIA  ·  ჩვენ შესახებ  ·  კონტაქტი","style":"padding:20px 14px;background:#202437;color:#f7f7fb;font-size:12px;border-radius:12px;margin:8px;"},"cartItem":{"name":"კალათის პროდუქტი","icon":"🛍","tag":"div","text":"ფოტო   პროდუქტის სახელი     49 ₾","style":"display:flex;align-items:center;gap:12px;padding:13px;border:1px solid #e5e7ed;border-radius:12px;background:#fff;color:#35394a;font-size:12px;margin:7px;"},"profile":{"name":"პროფილის ბლოკი","icon":"●","tag":"div","text":"◉  ჩემი პროფილი","style":"padding:15px;border-radius:13px;background:#f5f5fa;color:#303648;font-weight:750;margin:8px;"},"delivery":{"name":"მიწოდების არჩევანი","icon":"⇢","tag":"div","text":"○  მიწოდება     ○  თვითგატანა","style":"padding:14px;border:1px solid #e4e5eb;border-radius:12px;color:#424758;background:#fff;font-size:12px;margin:8px;"},"checkout":{"name":"შეკვეთის დადასტურება","icon":"✓","tag":"button","text":"შეკვეთის დადასტურება","style":"display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#b8447a;color:white;font-weight:900;font-size:13px;margin:8px;"},"section":{"name":"სექციის სათაური","icon":"☷","tag":"h2","text":"აღმოაჩინე კოლექცია","style":"font-size:22px;font-weight:900;color:#262b39;margin:16px 8px 8px;"}};
function notify(t){let n=document.getElementById('toast');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),1800)}
function tab(t){activeTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderPanel()}
function add(type){const def=defs[type];if(!def)return;const el=document.createElement(def.tag);el.className='canvas-el';el.dataset.kind=type;el.dataset.id='node-'+nextId++;el.textContent=def.text;el.style.cssText=def.style;el.draggable=true;board.appendChild(el);board.classList.remove('empty');document.getElementById('emptyMsg').style.display='none';wire(el);select(el);record();tab('style')}
function wire(el){el.addEventListener('click',e=>{e.stopPropagation();select(el)});el.addEventListener('dragstart',e=>{dragged=el;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',el.dataset.id);setTimeout(()=>el.style.opacity='.45',0)});el.addEventListener('dragend',()=>{el.style.opacity='';document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));dragged=null});el.addEventListener('dragover',e=>{e.preventDefault();if(dragged&&dragged!==el)el.classList.add('drag-over')});el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();el.classList.remove('drag-over');if(dragged&&dragged!==el){const r=el.getBoundingClientRect();board.insertBefore(dragged,e.clientY<r.top+r.height/2?el:el.nextSibling);record();renderPanel()}})}
board.addEventListener('click',e=>{if(e.target===board||e.target.id==='emptyMsg')select(null)});board.addEventListener('dragover',e=>{e.preventDefault()});board.addEventListener('drop',e=>{if(e.target===board&&dragged){e.preventDefault();board.appendChild(dragged);record()}});
function select(el){if(selected)selected.classList.remove('is-selected');selected=el;if(selected)selected.classList.add('is-selected');renderPanel();updateCount()}
function updateCount(){let n=board.querySelectorAll('.canvas-el').length;document.getElementById('canvasCount').textContent=n?'· '+n+' ელემენტი':'· ცარიელი';document.getElementById('emptyMsg').style.display=n?'none':'block';board.classList.toggle('empty',!n)}
function renderPanel(){if(activeTab==='add'){panel.innerHTML='<div class="panel-title">ელემენტების ბიბლიოთეკა <span>დააჭირე დასამატებლად</span></div><div class="tools-grid">'+Object.entries(defs).map(([k,v])=>'<button class="tool" onclick="add(\''+k+'\')"><i>'+v.icon+'</i>'+v.name+'</button>').join('')+'</div><div class="empty-panel">ელემენტი დაემატება სამუშაო ტილოზე. გადაადგილებისთვის გეჭიროს და გადაათრიე.</div>';return}
if(activeTab==='layers'){let els=[...board.querySelectorAll('.canvas-el')].reverse();panel.innerHTML='<div class="panel-title">შრეები <span>'+els.length+' ობიექტი</span></div>'+(els.length?'<div class="layers">'+els.map(el=>'<div class="layer '+(selected===el?'active':'')+'" onclick="selectById(\''+el.dataset.id+'\')"><span class="type">'+(defs[el.dataset.kind]?.icon||'◈')+'</span><span class="lname">'+escapeHtml(el.textContent.trim().slice(0,28)||defs[el.dataset.kind]?.name||'ელემენტი')+'</span><button onclick="event.stopPropagation();moveLayer(\''+el.dataset.id+'\',-1)">↑</button><button onclick="event.stopPropagation();moveLayer(\''+el.dataset.id+'\',1)">↓</button></div>').join('')+'</div>':'<div class="empty-panel">ჯერ ელემენტები არ დამატებულა.</div>');return}
if(activeTab==='style'){if(!selected){panel.innerHTML='<div class="panel-title">სტილის პარამეტრები</div><div class="empty-panel">მონიშნე ობიექტი ტილოზე ან შრეების სიიდან.</div>';return}const s=getComputedStyle(selected);panel.innerHTML='<div class="panel-title">ობიექტის პარამეტრები <span>'+selected.dataset.kind+'</span></div><div class="field"><label>ტექსტი</label><input id="editText" type="text"></div><div class="property-grid"><div class="field"><label>ფონის ფერი</label><input id="editBg" type="color"></div><div class="field"><label>ტექსტის ფერი</label><input id="editColor" type="color"></div><div class="field"><label>შრიფტის ზომა</label><input id="editSize" type="range" min="8" max="64"></div><div class="field"><label>მომრგვალება</label><input id="editRadius" type="range" min="0" max="40"></div><div class="field"><label>სიგანე (%)</label><input id="editWidth" type="range" min="10" max="100"></div><div class="field"><label>შიდა დაშორება</label><input id="editPad" type="range" min="0" max="40"></div></div><div class="property-actions"><button class="action" onclick="duplicate()">⧉ დუბლირება</button><button class="action" onclick="removeSelected()">⌫ წაშლა</button></div>';
document.getElementById('editText').value=selected.textContent;document.getElementById('editBg').value=toHex(s.backgroundColor)||'#ffffff';document.getElementById('editColor').value=toHex(s.color)||'#202532';document.getElementById('editSize').value=parseInt(s.fontSize)||16;document.getElementById('editRadius').value=parseInt(s.borderRadius)||0;document.getElementById('editWidth').value=Math.min(100,Math.round(selected.getBoundingClientRect().width/board.clientWidth*100));document.getElementById('editPad').value=parseInt(s.padding)||0;
bind('editText','input',v=>selected.textContent=v);bind('editBg','input',v=>selected.style.background=v);bind('editColor','input',v=>selected.style.color=v);bind('editSize','input',v=>selected.style.fontSize=v+'px');bind('editRadius','input',v=>selected.style.borderRadius=v+'px');bind('editWidth','input',v=>selected.style.width=v+'%');bind('editPad','input',v=>selected.style.padding=v+'px');return}
if(activeTab==='page'){panel.innerHTML='<div class="panel-title">გვერდის პარამეტრები</div><div class="property-grid"><div class="field"><label>ტილოს ფონი</label><input id="pageBg" type="color" value="'+(toHex(getComputedStyle(board).backgroundColor)||'#ffffff')+'"></div><div class="field"><label>ტილოს სიგანე</label><select id="pageWidth"><option value="320">320 px</option><option value="360">360 px</option><option value="390" selected>390 px</option><option value="430">430 px</option><option value="100%">ადაპტური</option></select></div></div><div class="property-actions"><button class="action" onclick="clearCanvas()">ტილოს გასუფთავება</button><button class="action" onclick="save()">შენახვა</button></div><div class="empty-panel">ეს არის დამოუკიდებელი, ცარიელი დიზაინის ტილო. საწყისი გვერდის კოდი არ იცვლება.</div>';document.getElementById('pageBg').oninput=e=>board.style.background=e.target.value;document.getElementById('pageWidth').onchange=e=>board.style.width=e.target.value==='100%'?'100%':e.target.value+'px'}}
function bind(id,event,fn){document.getElementById(id).addEventListener(event,e=>{fn(e.target.value);record(false)})}
function toHex(c){if(!c||c==='rgba(0, 0, 0, 0)')return null;let m=c.match(/\d+/g);return m&&m.length>=3?'#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join(''):null}
function selectById(id){select(board.querySelector('[data-id="'+id+'"]'))}
function moveLayer(id,d){let el=board.querySelector('[data-id="'+id+'"]');if(!el)return;if(d<0&&el.previousElementSibling)board.insertBefore(el,el.previousElementSibling);if(d>0&&el.nextElementSibling)board.insertBefore(el.nextElementSibling,el);record();renderPanel()}
function duplicate(){if(!selected)return;let c=selected.cloneNode(true);c.dataset.id='node-'+nextId++;c.classList.remove('is-selected');board.insertBefore(c,selected.nextSibling);wire(c);select(c);record()}
function removeSelected(){if(!selected)return;selected.remove();select(null);updateCount();record()}
function clearCanvas(){if(!confirm('წავშალო ტილოზე არსებული ყველა ელემენტი?'))return;board.querySelectorAll('.canvas-el').forEach(x=>x.remove());select(null);updateCount();record()}
function snapshot(){return {html:board.innerHTML,style:board.getAttribute('style'),nextId}}
function record(push=true){updateCount();if(!push)return;history=history.slice(0,historyAt+1);history.push(snapshot());if(history.length>40)history.shift();historyAt=history.length-1}
function restore(s){board.innerHTML=s.html;board.setAttribute('style',s.style||'');nextId=s.nextId||nextId;board.querySelectorAll('.canvas-el').forEach(wire);select(null);updateCount()}
function undo(){if(historyAt>0){historyAt--;restore(history[historyAt])}}
function redo(){if(historyAt<history.length-1){historyAt++;restore(history[historyAt])}}
function save(){localStorage.setItem('makasia-blank-canvas',JSON.stringify(snapshot()));notify('დიზაინი შენახულია ამ მოწყობილობაზე')}
function exportHtml(){let html='<!doctype html><html lang="ka"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ჩემი დიზაინი</title><style>body{margin:0;font-family:system-ui,sans-serif}.canvas{max-width:390px;min-height:100vh;margin:auto;padding:12px;box-sizing:border-box}.canvas-el{box-sizing:border-box;max-width:100%}</style><body><main class="canvas">'+board.innerHTML.replace(/ class="canvas-el is-selected"/g,' class="canvas-el"').replace(/ class="canvas-el drag-over"/g,' class="canvas-el"')+'</main></body></html>';let a=document.createElement('a'),u=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.href=u;a.download='makasia-canvas.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function preview(){notify('პრევიუ: ტილოზე არსებული დიზაინი')}
function setZoom(d){zoom=Math.max(.65,Math.min(1.2,zoom+d));board.style.transform='scale('+zoom+')';document.getElementById('zoomText').textContent=Math.round(zoom*100)+'%'}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const saved=localStorage.getItem('makasia-blank-canvas');if(saved){try{let s=JSON.parse(saved);board.innerHTML=s.html;board.setAttribute('style',s.style||'');nextId=s.nextId||1;board.querySelectorAll('.canvas-el').forEach(wire)}catch(e){}}updateCount();record();renderPanel();
</script></body></html>
