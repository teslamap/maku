<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828"><title>Makasia Admin V2</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100dvh}.sidebar{width:252px;background:#101828;color:#d9e1ef;padding:24px 14px;display:flex;flex-direction:column;gap:22px;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:0 10px;color:white;font-weight:800;font-size:19px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#b8f36b,#56c7a6);display:grid;place-items:center;color:#10231c;font-weight:900}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aebbd0;text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#243248;color:white}.nav small{color:#8191a9;text-transform:uppercase;letter-spacing:.1em;font-size:10px;padding:12px 10px 5px}.sidefoot{margin-top:auto;padding:10px;color:#8796ad;font-size:12px}.main{min-width:0;flex:1}.top{height:76px;background:white;border-bottom:1px solid #e8edf4;display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:2}.top h1{font-size:19px;margin:0}.muted{color:#748096;font-size:13px}.user{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#e9f8e5;color:#2c6739;display:grid;place-items:center;font-weight:800}.content{padding:28px;max-width:1440px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.welcome h2{font-size:25px;margin:0 0 5px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card,.panel{background:white;border:1px solid #e8edf4;border-radius:16px;padding:20px;box-shadow:0 3px 14px #1c2b4406}.statlabel{color:#748096;font-size:13px}.stat{font-size:27px;font-weight:800;margin:9px 0 3px;letter-spacing:-.03em}.statfoot{font-size:12px;color:#7e899c}.section{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:18px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.panel h3{margin:0;font-size:15px}.tag{font-size:11px;color:#398344;background:#eaf8e9;padding:5px 9px;border-radius:20px}.empty{padding:36px 12px;text-align:center;color:#8490a2;font-size:13px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #eef1f6;white-space:nowrap}th{font-weight:600;color:#7b8799;font-size:11px}.primary{background:#17283d;color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:650}.ghost{border:1px solid #e0e6ef;background:white;border-radius:9px;padding:8px 12px;color:#344054}.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top left,#e1f5d8,transparent 50%),#f3f6fb}.loginbox{background:white;width:min(420px,100%);padding:32px;border-radius:22px;box-shadow:0 20px 60px #15233b18}.loginbox h1{margin:18px 0 6px}.field{display:grid;gap:7px;margin:17px 0}.field label{font-size:13px;font-weight:650}.field input{width:100%;border:1px solid #dce3ec;border-radius:10px;padding:12px;outline:none}.field input:focus{border-color:#619c75;box-shadow:0 0 0 3px #dff2df}.error{color:#b42318;font-size:13px;min-height:18px}.mobilebar{display:none}.notice{padding:13px 15px;border:1px solid #f0dfaa;background:#fff9e6;color:#72571c;border-radius:12px;font-size:13px;margin:0 0 18px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.section{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{display:none}.top{height:64px;padding:0 16px}.content{padding:18px 14px 90px}.welcome h2{font-size:21px}.cards{gap:10px}.card{padding:15px}.stat{font-size:23px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:#101828;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));justify-content:space-around}.mobilebar button{background:transparent;border:0;color:#aebbd0;font-size:10px;display:grid;gap:4px;justify-items:center;padding:5px}.mobilebar button.active{color:#b8f36b}.mobilebar b{font-size:17px}.top .muted{display:none}}
</style>
</head>
<body>
<div id="root"><div class="login"><div class="loginbox">იტვირთება…</div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(()=>{'use strict';
const firebaseConfig={apiKey:"AIzaSyDuZpWaZFY18eyJNOMjFap2XVTr6D0cMyE",authDomain:"makasia.firebaseapp.com",projectId:"makasia",storageBucket:"makasia.firebasestorage.app",messagingSenderId:"51102698357",appId:"1:51102698357:web:59f62a3c8e76663947a13c"};
const OWNER_UID="D2N37vcj9tgGKdhw0oXKOhetK3q1";
const modules=[["overview","◫","მიმოხილვა"],["products","▦","პროდუქტები"],["inventory","▤","მარაგები"],["orders","▣","შეკვეთები"],["customers","♙","მომხმარებლები"],["reviews","☆","შეფასებები"],["promos","◇","პრომო კოდები"],["finance","＄","ფინანსები"],["content","▧","კონტენტი"],["staff","♧","თანამშრომლები"],["audit","≡","აუდიტი"],["reports","▥","ანგარიშები"],["settings","⚙","პარამეტრები"]];
let app,auth,db,current="overview",data={products:[],orders:[],users:[],reviews:[],promos:[]},busy=false;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat("ka-GE",{style:"currency",currency:"GEL",maximumFractionDigits:2}).format(Number(n)||0);
function loginView(err=""){ $("#root").innerHTML='<div class="login"><form class="loginbox" id="login"><div class="brand" style="padding:0;color:#172033"><span class="logo">M</span> MAKASIA <span class="muted">ADMIN V2</span></div><h1>მოგესალმები</h1><p class="muted">ადმინისტრირების უსაფრთხო პანელი</p><div class="field"><label for="email">ელფოსტა</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">პაროლი</label><input id="password" type="password" autocomplete="current-password" required></div><div class="error" id="err">'+esc(err)+'</div><button class="primary" style="width:100%;padding:13px" type="submit">შესვლა</button><p class="muted" style="margin:18px 0 0;font-size:11px">წვდომა ენიჭება მხოლოდ ავტორიზებულ ადმინისტრატორებს.</p></form></div>';$("#login").addEventListener("submit",async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{await auth.signInWithEmailAndPassword($("#email").value.trim(),$("#password").value)}catch(ex){$("#err").textContent="შესვლა ვერ მოხერხდა. გადაამოწმე მონაცემები.";btn.disabled=false}})}
function layout(){const label=modules.find(m=>m[0]===current)?.[2]||"მიმოხილვა";$("#root").innerHTML='<div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">M</span> MAKASIA</div><nav class="nav"><small>სამუშაო სივრცე</small>'+modules.map(m=>'<button data-page="'+m[0]+'" class="'+(m[0]===current?"active":"")+'"><span>'+m[1]+'</span>'+m[2]+'</button>').join("")+'</nav><div class="sidefoot">ADMIN V2 · დაცული სივრცე<br>Made by Suliko for ma🐢 makasia</div></aside><main class="main"><header class="top"><h1>'+label+'</h1><div class="user"><span class="muted">მთავარი ადმინისტრატორი</span><span class="avatar">S</span><button class="ghost" id="logout">გასვლა</button></div></header><div class="content" id="page"></div></main><nav class="mobilebar">'+modules.slice(0,5).map(m=>'<button data-page="'+m[0]+'" class="'+(m[0]===current?"active":"")+'"><b>'+m[1]+'</b>'+m[2]+'</button>').join("")+'</nav></div>';document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{current=b.dataset.page;layout()});$("#logout").onclick=()=>auth.signOut();renderPage()}
function stat(label,value,foot){return '<div class="card"><div class="statlabel">'+label+'</div><div class="stat">'+value+'</div><div class="statfoot">'+foot+'</div></div>'}
function renderPage(){const p=$("#page");if(current==="overview"){const active=data.orders.filter(o=>!["გაუქმებული","cancelled","canceled"].includes(o.status));const total=active.reduce((s,o)=>s+Number(o.total||o.totalPrice||o.amount||0),0);const low=data.products.filter(x=>Number(x.stock||0)<=5);p.innerHTML='<div class="welcome"><div><h2>მოგესალმები, სოლო 👋</h2><div class="muted">მაღაზიის ოპერაციების ერთიანი მართვა</div></div><span class="tag">სისტემა აქტიურია</span></div><div class="notice">V2-ის საწყისი ვერსია ცალკე მუშაობს ძველი ადმინისგან. მონაცემთა ცვლილებები ეტაპობრივად დაემატება უსაფრთხოების წესების შემოწმების შემდეგ.</div><div class="cards">'+stat("შემოსავალი",money(total),"აქტიური შეკვეთების ჯამი")+stat("შეკვეთები",active.length,"გაუქმებულის გარეშე")+stat("პროდუქტები",data.products.length,"კატალოგში")+stat("დაბალი მარაგი",low.length,"5 ან ნაკლები ერთეული")+'</div><div class="section"><section class="panel"><div class="panelhead"><h3>ბოლო შეკვეთები</h3><button class="ghost" data-page="orders">ყველა</button></div><div class="tablewrap"><table><thead><tr><th>შეკვეთა</th><th>მომხმარებელი</th><th>სტატუსი</th><th>ჯამი</th></tr></thead><tbody>'+data.orders.slice().sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,6).map((o,i)=>'<tr><td>#'+esc(o.id||i+1)+'</td><td>'+esc(o.customerName||o.name||"—")+'</td><td>'+esc(o.status||"—")+'</td><td>'+money(o.total||o.totalPrice||o.amount)+'</td></tr>').join("")+'</tbody></table></div>'+(data.orders.length?"":'<div class="empty">შეკვეთები ჯერ არ არის</div>')+'</section><section class="panel"><div class="panelhead"><h3>მარაგის გაფრთხილება</h3><span class="tag">'+low.length+' პროდუქტი</span></div>'+(low.slice(0,7).map(x=>'<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eef1f6;font-size:13px"><span>'+esc(x.name||"პროდუქტი")+'</span><b style="color:'+(Number(x.stock)<=0?"#b42318":"#a36b14")+'">'+Number(x.stock||0)+' ც.</b></div>').join("")||'<div class="empty">ყველაფერი წესრიგშია</div>')+'</section></div>'}
else{const meta=modules.find(m=>m[0]===current);const map={products:["products","პროდუქტები"],orders:["orders","შეკვეთები"],customers:["users","მომხმარებლები"],reviews:["reviews","შეფასებები"],promos:["promos","პრომო კოდები"]};const m=map[current];p.innerHTML='<div class="welcome"><div><h2>'+meta[2]+'</h2><div class="muted">მონაცემების უსაფრთხო მართვის მოდული</div></div></div>'+(m?'<section class="panel"><div class="panelhead"><h3>არსებული ჩანაწერები</h3><span class="tag">'+data[m[0]].length+' ჩანაწერი</span></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>სახელი / ინფორმაცია</th><th>სტატუსი</th></tr></thead><tbody>'+data[m[0]].slice(0,100).map((x,i)=>'<tr><td>'+esc(x.id||i+1)+'</td><td>'+esc(x.name||x.code||x.customerName||x.email||x.productName||"—")+'</td><td>'+esc(x.status||"—")+'</td></tr>').join("")+'</tbody></table></div>'+(data[m[0]].length?"":'<div class="empty">ჩანაწერები ვერ მოიძებნა ან ჯერ არ არის</div>')+'</section>':'<section class="panel"><div class="empty">მოდულის საწყისი ჩარჩო მზადდება. მონაცემებზე მოქმედებები ჩაირთვება უფლებებისა და აუდიტის წესების დასრულების შემდეგ.</div></section>')}}
async function load(){for(const k of Object.keys(data)){try{const s=await db.collection(k).limit(200).get();data[k]=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){console.warn("Read denied:",k,e.code);data[k]=[]}}if($("#page"))renderPage()}
function init(){try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async u=>{if(!u){loginView();return}if(u.uid!==OWNER_UID){await auth.signOut();loginView("ამ ანგარიშს ადმინისტრატორის წვდომა არ აქვს.");return}layout();await load()})}catch(e){$("#root").innerHTML='<div class="login"><div class="loginbox">Firebase-ის ჩატვირთვა ვერ მოხერხდა. შეამოწმე ინტერნეტი.</div></div>'}}
init();
})();
</script>
</body></html>
