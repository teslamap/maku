<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makasia Management</title><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff7fa;color:#382831;font:14px Arial}.wrap{max-width:1200px;margin:auto;padding:22px}.card{background:white;border:1px solid #f3d9e3;border-radius:16px;padding:18px;margin:0 0 16px;box-shadow:0 8px 28px #c9588010}.hidden{display:none!important}.login{max-width:400px;margin:10vh auto}.brand{font-size:24px;font-weight:bold;color:#c95880}h2{font-size:18px}.muted{color:#927c85}.field{padding:11px;border:1px solid #e9cbd7;border-radius:9px;font:inherit;margin:6px 0 12px;width:100%}.btn{border:0;border-radius:9px;padding:10px 14px;background:#c95880;color:#fff;font-weight:bold;cursor:pointer}.btn.alt{background:#ffedf3;color:#a83c66}.btn.danger{background:#fee2e2;color:#b91c1c}.top,.toolbar,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{font-size:28px;font-weight:bold;color:#c95880}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}td,th{text-align:left;padding:11px 8px;border-bottom:1px solid #f3e2e8;vertical-align:middle}th{color:#927c85;font-size:12px}td img{width:44px;height:44px;object-fit:cover;border-radius:8px}.toolbar .field{flex:1;min-width:170px;margin:0}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:15px}.dialog{background:white;border-radius:16px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.err{color:#b42345;min-height:18px}@media(max-width:600px){.wrap{padding:12px}.stats,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><section id="login" class="card login"><div class="brand">♡ MAKASIA</div><h2>მართვის პანელში შესვლა</h2><form id="loginForm"><label>ელფოსტა</label><input id="email" class="field" type="email" required><label>პაროლი</label><input id="password" class="field" type="password" required><button class="btn" style="width:100%">შესვლა</button></form><p id="loginError" class="err"></p></section><section id="app" class="hidden"><header class="top"><div><div class="brand">♡ MAKASIA</div><span class="muted">მართვის პანელი · <b id="role"></b></span></div><button id="logout" class="btn">გასვლა</button></header><div class="stats"><div class="card">პროდუქტები<div id="productsCount" class="metric">—</div></div><div class="card">შეკვეთები<div id="ordersCount" class="metric">—</div></div><div class="card">ახალი შეკვეთები<div id="newCount" class="metric">—</div></div></div><section class="card"><div class="top"><h2>პროდუქტების მართვა</h2><button id="add" class="btn">＋ დამატება</button></div><div class="toolbar"><input id="pSearch" class="field" placeholder="პროდუქტის ძებნა"></div><div class="tablewrap"><table><thead><tr><th>პროდუქტი</th><th>კატეგორია</th><th>ფასი</th><th>მარაგი</th><th>სტატუსი</th><th>მოქმედება</th></tr></thead><tbody id="pRows"></tbody></table></div></section><section class="card"><h2>შეკვეთები</h2><div class="toolbar"><input id="oSearch" class="field" placeholder="შეკვეთის ან მომხმარებლის ძებნა"><select id="oFilter" class="field"><option value="">ყველა სტატუსი</option><option>ახალი</option><option>მუშავდება</option><option>გაგზავნილია</option><option>შესრულებულია</option><option>გაუქმებულია</option></select></div><div class="tablewrap"><table><thead><tr><th>№</th><th>მომხმარებელი</th><th>ტელეფონი</th><th>პროდუქტები</th><th>თანხა</th><th>სტატუსი</th><th></th></tr></thead><tbody id="oRows"></tbody></table></div></section></section></main><div id="modal" class="modal hidden"><div class="dialog"><h2 id="mTitle">პროდუქტი</h2><form id="pForm"><input id="pid" type="hidden"><div class="formgrid"><div class="full"><label>სახელი *</label><input id="name" class="field" required maxlength="120"></div><div><label>კატეგორია</label><input id="category" class="field"></div><div><label>ფასი ₾ *</label><input id="price" class="field" type="number" min="0" step=".01" required></div><div><label>ძველი ფასი ₾</label><input id="oldPrice" class="field" type="number" min="0" step=".01"></div><div><label>მარაგი</label><input id="stock" class="field" type="number" min="0" step="1"></div><div class="full"><label>სურათის HTTPS ბმული</label><input id="image" class="field" type="url"></div><div class="full"><label>აღწერა</label><textarea id="description" class="field" rows="4"></textarea></div><div class="full"><label>სტატუსი</label><select id="status" class="field"><option value="active">აქტიური</option><option value="inactive">დამალული</option></select></div></div><p id="formError" class="err"></p><div class="actions" style="justify-content:flex-end"><button type="button" id="cancel" class="btn alt">გაუქმება</button><button class="btn">შენახვა</button></div></form></div></div><script>
const cfg={apiKey:"AIzaSyDuZpWaZFY18eyJNOMjFap2XVTr6D0cMyE",authDomain:"makasia.firebaseapp.com",projectId:"makasia",storageBucket:"makasia.firebasestorage.app",messagingSenderId:"51102698357",appId:"1:51102698357:web:59f62a3c8e76663947a13c"};if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore(),$=x=>document.getElementById(x),adminUid="D2N37vcj9tgGKdhw0oXKOhetK3q1";let ps=[],os=[];function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function toast(t){alert(t)}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(e){$("loginError").textContent="შესვლა ვერ მოხერხდა; გადაამოწმე მონაცემები."}};$("logout").onclick=()=>auth.signOut();auth.onAuthStateChanged(async u=>{if(!u){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}try{let admin=u.uid===adminUid,doc=admin?null:await db.collection("users").doc(u.uid).get();if(!admin&&!(doc.exists&&doc.data().role==="manager")){await auth.signOut();$("loginError").textContent="წვდომა არ გაქვს.";return}$("login").classList.add("hidden");$("app").classList.remove("hidden");$("role").textContent=admin?"ადმინისტრატორი":"მენეჯერი";await load()}catch(e){$("loginError").textContent="წვდომის შემოწმება ვერ მოხერხდა. Rules შეამოწმე."}});
async function load(){try{let [p,o]=await Promise.all([db.collection("products").get(),db.collection("orders").orderBy("createdAt","desc").limit(150).get()]);ps=p.docs.map(d=>({id:d.id,...d.data()}));os=o.docs.map(d=>({id:d.id,...d.data()}));$("productsCount").textContent=ps.length;$("ordersCount").textContent=os.length;$("newCount").textContent=os.filter(x=>["ახალი","new","pending","შეკვეთილია"].includes(x.status)).length;renderP();renderO()}catch(e){$("pRows").innerHTML='<tr><td colspan="6">ჩატვირთვის შეცდომა — Firestore Rules შეამოწმე.</td></tr>';$("oRows").innerHTML='<tr><td colspan="7">ჩატვირთვის შეცდომა.</td></tr>'}}
function renderP(){let q=$("pSearch").value.toLowerCase();let arr=ps.filter(p=>(p.name||"").toLowerCase().includes(q)||(p.category||"").toLowerCase().includes(q));$("pRows").innerHTML=arr.map(p=>'<tr><td>'+(p.image?'<img src="'+esc(p.image)+'">':'♡')+' '+esc(p.name)+'</td><td>'+esc(p.category)+'</td><td>'+esc(p.price)+' ₾</td><td>'+esc(p.stock??"—")+'</td><td>'+((p.status==="inactive"||p.status==="დამალული")?"დამალული":"აქტიური")+'</td><td><button class="btn alt" onclick="editP(\''+p.id+'\')">შეცვლა</button> <button class="btn danger" onclick="delP(\''+p.id+'\')">წაშლა</button></td></tr>').join("")||'<tr><td colspan="6">პროდუქტი არ მოიძებნა</td></tr>'}
function renderO(){let q=$("oSearch").value.toLowerCase(),f=$("oFilter").value;let st=["ახალი","მუშავდება","გაგზავნილია","შესრულებულია","გაუქმებულია"];let arr=os.filter(o=>(!f||o.status===f)&&[o.orderNumber,o.customerName,o.phone,o.userEmail].some(v=>String(v||"").toLowerCase().includes(q)));$("oRows").innerHTML=arr.map(o=>{let items=Array.isArray(o.items)?o.items.map(i=>(i.name||"პროდუქტი")+" × "+(i.quantity||1)).join(", "):o.productDetails||"";return '<tr><td>'+esc(o.orderNumber||o.id)+'</td><td>'+esc(o.customerName||o.userEmail)+'</td><td>'+esc(o.phone)+'</td><td>'+esc(items)+'</td><td>'+esc(o.totalAmount??o.subtotal??o.totalPrice??"—")+'</td><td><select class="field" id="s_'+esc(o.id)+'">'+st.map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join("")+'</select></td><td><button class="btn alt" onclick="saveO(\''+o.id+'\')">შენახვა</button></td></tr>'}).join("")||'<tr><td colspan="7">შეკვეთები არ არის</td></tr>'}
$("pSearch").oninput=renderP;$("oSearch").oninput=renderO;$("oFilter").onchange=renderO;function modal(p){$("pForm").reset();$("pid").value=p?.id||"";$("mTitle").textContent=p?"პროდუქტის შეცვლა":"ახალი პროდუქტი";for(let k of ["name","category","price","oldPrice","stock","image","description","status"])$(k).value=p?.[k]??(k==="stock"?1:k==="status"?"active":"");$("formError").textContent="";$("modal").classList.remove("hidden")}window.editP=id=>modal(ps.find(p=>p.id===id));$("add").onclick=()=>modal();$("cancel").onclick=()=>$("modal").classList.add("hidden");$("pForm").onsubmit=async e=>{e.preventDefault();let id=$("pid").value,d={name:$("name").value.trim(),category:$("category").value.trim(),price:Number($("price").value),oldPrice:Number($("oldPrice").value)||0,stock:Number($("stock").value)||0,image:$("image").value.trim(),description:$("description").value.trim(),status:$("status").value,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};if(!id)d.createdAt=firebase.firestore.FieldValue.serverTimestamp();try{if(id)await db.collection("products").doc(id).update(d);else await db.collection("products").add(d);$("modal").classList.add("hidden");await load();toast("პროდუქტი შენახულია")}catch(x){$("formError").textContent="ვერ შეინახა — წვდომა ან მონაცემები შეამოწმე."}};window.delP=async id=>{let p=ps.find(x=>x.id===id);if(p&&confirm("წავშალო "+p.name+"?"))try{await db.collection("products").doc(id).delete();await load()}catch(e){toast("წაშლა ვერ მოხერხდა")}};window.saveO=async id=>{try{await db.collection("orders").doc(id).update({status:$("s_"+id).value,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await load();toast("სტატუსი შენახულია")}catch(e){toast("სტატუსის შეცვლა ვერ მოხერხდა; Rules შეამოწმე.")}};
</script></body></html>
